<!doctype html>
<html lang="zh-Hans"><head><meta charset="utf-8">

<title>信息流汇总 · 历史</title>
<style>
:root{--bg:#f6f7f9;--card:#fff;--ink:#16181d;--sub:#5b6472;--line:#e4e7ec;--accent:#2563eb;--chip:#eef2ff;
--chipink:#3730a3;--hot:#dc2626;--warn:#b45309;--ok:#15803d;--up:#dc2626;--down:#15803d;--soft:#f1f5f9}
@media(prefers-color-scheme:dark){:root{--bg:#0f1115;--card:#181b21;--ink:#e8eaed;--sub:#9aa3b2;--line:#2a2f3a;
--accent:#7aa2ff;--chip:#232a44;--chipink:#b8c4ff;--hot:#f87171;--warn:#fbbf24;--ok:#4ade80;--up:#f87171;
--down:#4ade80;--soft:#20242c}}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.65 -apple-system,BlinkMacSystemFont,"Segoe UI",
"Hiragino Sans","Noto Sans JP","PingFang SC","Microsoft YaHei",sans-serif;word-break:break-word}
a{color:var(--accent);text-decoration:none}
a:active{opacity:.6}
.wrap{max-width:820px;margin:0 auto;padding:16px 14px 56px}
header h1{font-size:21px;margin:6px 0 2px;line-height:1.3}
header p{margin:0;color:var(--sub);font-size:13px}
nav{position:sticky;top:0;z-index:5;background:var(--bg);margin:10px -14px 4px;padding:8px 14px;
display:flex;gap:8px;overflow-x:auto;border-bottom:1px solid var(--line);scrollbar-width:none}
nav::-webkit-scrollbar{display:none}
nav a{flex:0 0 auto;padding:4px 12px;border-radius:999px;background:var(--card);border:1px solid var(--line);
color:var(--ink);font-size:13px}
section{margin-top:22px;scroll-margin-top:52px}
h2{font-size:17px;margin:0 0 10px;display:flex;align-items:baseline;gap:8px;flex-wrap:wrap}
h2 small{font-weight:400;color:var(--sub);font-size:12px}
h3{font-size:14px;margin:16px 0 6px;color:var(--sub);font-weight:600}
.card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:12px 14px;margin-bottom:10px}
.lead{font-size:16px;font-weight:600;margin:6px 0 4px;line-height:1.5}
.num{color:var(--sub);font-size:13px;margin:0 0 6px}
ul.plain{list-style:none;margin:0;padding:0}
ul.plain>li{padding:9px 0;border-bottom:1px solid var(--line)}
ul.plain>li:last-child{border-bottom:0}
ul.tight>li{padding:6px 0}
.t{font-weight:600}
.meta{color:var(--sub);font-size:12px;margin-top:2px}
.chip{display:inline-block;padding:0 7px;border-radius:999px;background:var(--chip);color:var(--chipink);
font-size:12px;line-height:20px;margin-right:4px;white-space:nowrap}
.chip.hot{background:var(--hot);color:#fff}
.chip.new{background:var(--ok);color:#fff}
.chip.good{background:transparent;border:1px solid var(--ok);color:var(--ok)}
.chip.bad{background:transparent;border:1px solid var(--hot);color:var(--hot)}
.chip.warn{background:transparent;border:1px solid var(--warn);color:var(--warn)}
.chip.dim{background:var(--soft);color:var(--sub)}
.stance{display:inline-block;padding:2px 14px;border-radius:999px;font-weight:700;color:#fff;background:var(--accent)}
.by{font-size:12px;color:var(--sub);margin-left:8px}
table{width:100%;border-collapse:collapse;font-size:13px;font-variant-numeric:tabular-nums}
th,td{padding:6px 4px;border-bottom:1px solid var(--line);text-align:right;white-space:nowrap}
th:first-child,td:first-child{text-align:left;white-space:normal}
td.l,th.l{text-align:left;white-space:normal}
th{color:var(--sub);font-weight:500;font-size:12px}
tr:last-child td{border-bottom:0}
.scroll{overflow-x:auto}
.up{color:var(--up)}.down{color:var(--down)}.dim{color:var(--sub)}
.spark{display:block;width:72px;height:22px;flex:0 0 auto}
.mk-h{display:flex;align-items:center;gap:10px}
.mk-h .t{flex:1 1 auto;min-width:0}
.mk-p{font-variant-numeric:tabular-nums;font-weight:600}
.mk-c{color:var(--sub);font-size:13px;font-variant-numeric:tabular-nums;margin-top:1px}
.mk-c b{color:var(--ink);font-weight:600}
.fh{display:flex;align-items:baseline;gap:8px}
.fh .t{flex:1 1 auto;min-width:0}
.fh .n{color:var(--sub);font-size:13px;font-variant-numeric:tabular-nums;white-space:nowrap}
.spark polyline{fill:none;stroke:var(--accent);stroke-width:1.6;stroke-linejoin:round;stroke-linecap:round}
.day{font-size:13px;color:var(--sub);font-weight:600;margin:14px 0 2px}
.when{font-variant-numeric:tabular-nums;font-weight:600;margin-right:6px}
details{margin-top:8px}
summary{cursor:pointer;color:var(--accent);font-size:13px;padding:4px 0}
.ref{font-size:12px;margin-left:3px}
.btn{display:inline-block;margin:4px 6px 0 0;padding:3px 10px;border:1px solid var(--accent);border-radius:8px;
font-size:12px}
.go{display:inline-block;margin-left:6px;padding:0 8px;border-radius:6px;background:var(--accent);color:#fff;
font-size:12px;line-height:20px;white-space:nowrap}
footer{margin-top:30px;color:var(--sub);font-size:12px;text-align:center}
</style></head>
