<script>
const BASE="https://jumpshop-benelic.com";

// ===== 智能结算：点击时用 Storefront API 现场建购物车，按店铺限购自动修正数量 =====
// 店铺用校验函数限购（默认 10 件，个别商品更低）。超限时 cartCreate 返回
// 「商品名」はおひとり様N点までのご購入となります。—— 取出 N 改数量重试，成功就去结算。
// 学到的限购存在浏览器 localStorage，下次直接用对的数量。任何失败都退回原来的结算直链。
const API=BASE+'/api/2026-10/graphql.json';
const KNOWN={};
const LKEY='jso_limits_v1';
function loadLim(){let m={};try{m=JSON.parse(localStorage.getItem(LKEY)||'{}')||{}}catch(e){}return Object.assign({},KNOWN,m);}
function saveLim(m){try{localStorage.setItem(LKEY,JSON.stringify(m))}catch(e){}}
function qtyOf(vid,q){const l=loadLim()[vid];return l?Math.max(1,Math.min(q,l)):q;}
const MUT='mutation($lines:[CartLineInput!]){cartCreate(input:{lines:$lines}){cart{checkoutUrl} userErrors{code message} warnings{code message}}}';
function limitOf(msg){const s=(msg||'').normalize('NFKC');const m=s.match(/(?:おひとり様|お一人様|おひとりさま|お1人様|1人|一人)\s*(?:につき|あたり)?\s*(\d+)\s*(?:点|個|つ|枚|本|冊|セット)/);return m?parseInt(m[1],10):null;}
// 商品名本身可能带「」（如「「天野明展」アートコースター…」はおひとり様1点まで），
// 所以取最外层：从第一个「到紧挨着「は おひとり様…」的那个」
function nameOf(msg){const m=(msg||'').match(/「(.+)」\s*は\s*(?:おひとり|お一人|お1人|1人|一人)/);return m?m[1]:'';}
function norm(s){return (s||'').normalize('NFKC').replace(/\s+/g,' ').trim();}
function permalink(lines){return BASE+'/cart/'+lines.map(l=>l.vid+':'+l.qty).join(',');}
let toastTimer=null;
function toast(t){let el=document.getElementById('toast');if(!el){el=document.createElement('div');el.id='toast';
  el.style.cssText='position:fixed;left:50%;bottom:76px;transform:translateX(-50%);background:rgba(0,0,0,.82);color:#fff;padding:8px 14px;border-radius:8px;font-size:13px;z-index:20;max-width:90%;text-align:center';
  document.body.appendChild(el);}el.textContent=t;el.style.display='block';clearTimeout(toastTimer);toastTimer=setTimeout(()=>{el.style.display='none'},4000);}
async function smartCheckout(items){
  if(!items.length) return;
  const w=window.open('about:blank','_blank');   // 先同步开好窗口，避免异步之后被拦截弹窗
  const go=u=>{if(w&&!w.closed){w.location.href=u}else{location.href=u}};
  const lim=loadLim();
  const lines=items.map(it=>({vid:String(it.vid),name:it.name||'',qty:Math.max(1,Math.min(it.qty,lim[it.vid]||it.qty))}));
  toast('正在确认限购与库存…');
  try{
    for(let i=0;i<4;i++){
      const r=await fetch(API,{method:'POST',headers:{'Content-Type':'application/json'},
        body:JSON.stringify({query:MUT,variables:{lines:lines.map(l=>({merchandiseId:'gid://shopify/ProductVariant/'+l.vid,quantity:l.qty}))}})});
      if(!r.ok) throw new Error('HTTP '+r.status);
      const d=await r.json();
      const p=d&&d.data&&d.data.cartCreate;
      const errs=(p&&p.userErrors)||[];
      if(p&&p.cart&&p.cart.checkoutUrl&&!errs.length){saveLim(lim);go(p.cart.checkoutUrl);return;}
      let changed=false;
      for(const e of errs){
        const n=limitOf(e.message);if(!n) continue;
        const nm=nameOf(e.message);
        const nn=norm(nm);
        let tg=nn?lines.filter(l=>norm(l.name)===nn):[];   // 先找商品名完全相同的
        if(!tg.length&&nn) tg=lines.filter(l=>{const x=norm(l.name);return x&&(x.indexOf(nn)>=0||nn.indexOf(x)>=0);});
        if(!tg.length) tg=lines.filter(l=>l.qty>n);
        tg.forEach(l=>{lim[l.vid]=n;if(l.qty>n){l.qty=n;changed=true;}});
      }
      if(!changed){throw new Error((errs[0]&&errs[0].message)||(d.errors&&d.errors[0]&&d.errors[0].message)||'未知错误');}
      saveLim(lim);
      toast('已按限购调整数量：'+lines.map(l=>l.qty).join(' / ')+' 件，重试中…');
    }
    throw new Error('多次调整仍失败');
  }catch(err){
    saveLim(lim);
    toast('自动确认失败，改用结算直链：'+err.message);
    go(permalink(lines));
  }
}
function applyLimitsToLinks(){
  const lim=loadLim();
  document.querySelectorAll('a.cart[data-vid]').forEach(a=>{const l=lim[a.dataset.vid];const q=parseInt(a.dataset.qty,10);
    if(l&&l<q){a.href=a.href.replace(/=\d+$/,'='+l);a.textContent='🛒 加购 '+l;a.dataset.qty=String(l);}});
  document.querySelectorAll('a.checkout[data-vid]').forEach(a=>{const l=lim[a.dataset.vid];const q=parseInt(a.dataset.qty,10);
    if(l&&l<q){a.href=a.href.replace(/:\d+$/,':'+l);a.dataset.qty=String(l);}});
}
document.querySelectorAll('a.checkout[data-vid]').forEach(a=>{
  a.addEventListener('click',e=>{e.preventDefault();e.stopPropagation();
    smartCheckout([{vid:a.dataset.vid,qty:parseInt(a.dataset.qty,10)||1,name:a.dataset.name||''}]);});
});
applyLimitsToLinks();

const boxes=document.querySelectorAll('.sel');
const cntEl=document.getElementById('cnt');
const btnCart=document.getElementById('btnCart');
const btnCopy=document.getElementById('btnCopy');
const btnWatch=document.getElementById('btnWatch');
const btnExclude=document.getElementById('btnExclude');
const allCk=document.getElementById('allck');

function update(){
  const n=[...boxes].filter(b=>b.checked).length;
  cntEl.textContent='已选 '+n;
  btnCart.disabled=btnCopy.disabled=btnWatch.disabled=btnExclude.disabled=n===0;
  const enabled=[...boxes].filter(b=>!b.disabled);
  allCk.checked=enabled.length>0&&enabled.every(b=>b.checked);
}

// 阻止卡片内链接触发 label 选中
document.querySelectorAll('.card a').forEach(a=>{
  a.addEventListener('click',e=>e.stopPropagation());
});

allCk.addEventListener('change',function(){
  const v=this.checked;
  boxes.forEach(b=>{if(!b.disabled) b.checked=v;});
  update();
});

boxes.forEach(b=>b.addEventListener('change',update));

function selectedItems(){
  return [...boxes].filter(b=>b.checked).map(b=>({
    vid:b.dataset.vid, qty:qtyOf(b.dataset.vid, parseInt(b.dataset.qty,10)||1), name:b.dataset.name||''
  }));
}
function buildUrl(){
  // 路径 permalink：/cart/V1:Q1,V2:Q2,...（复制用；数量已按已知限购修正）
  return permalink(selectedItems());
}
btnCart.addEventListener('click',function(){
  // 现场建购物车：按店铺限购自动修正数量后直接去结算
  smartCheckout(selectedItems());
});

btnCopy.addEventListener('click',function(){
  const url=buildUrl();
  const done=()=>{this.textContent='✅';setTimeout(()=>this.textContent='📋',1500)};
  if(navigator.clipboard){
    navigator.clipboard.writeText(url).then(done.bind(this)).catch(()=>{
      const ta=document.createElement('textarea');ta.value=url;document.body.appendChild(ta);ta.select();document.execCommand('copy');document.body.removeChild(ta);done.call(this);
    });
  }else{
    const ta=document.createElement('textarea');ta.value=url;document.body.appendChild(ta);ta.select();document.execCommand('copy');document.body.removeChild(ta);done.call(this);
  }
});

function exportList(type,label){
  const items=[...boxes].filter(b=>b.checked).map(b=>({
    handle: b.dataset.handle,
    name: b.dataset.name
  }));
  // 按 handle 去重
  const seen=new Set();
  const unique=items.filter(it=>{
    if(seen.has(it.handle)) return false;
    seen.add(it.handle);
    return true;
  });
  const now=new Date();
  const pad=n=>String(n).padStart(2,'0');
  const ts=now.getFullYear()+pad(now.getMonth()+1)+pad(now.getDate())+'_'+pad(now.getHours())+pad(now.getMinutes());
  const data={
    type: type,
    exported_at: now.toISOString(),
    count: unique.length,
    items: unique
  };
  const blob=new Blob([JSON.stringify(data,null,2)],{type:'application/json'});
  const a=document.createElement('a');
  a.href=URL.createObjectURL(blob);
  a.download='jso_'+type+'_'+ts+'.json';
  document.body.appendChild(a);
  a.click();
  document.body.removeChild(a);
  URL.revokeObjectURL(a.href);
}

btnWatch.addEventListener('click',function(){exportList('watch','重点')});
btnExclude.addEventListener('click',function(){exportList('exclude','排除')});
</script>
